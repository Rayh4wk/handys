services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: handys
      POSTGRES_PASSWORD: handys
      POSTGRES_DB: handys
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handys -d handys"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://handys:handys@db:5432/handys
      # Demo default; override with `SESSION_SECRET=... docker compose up`.
      SESSION_SECRET: ${SESSION_SECRET:-handys-demo-session-secret-change-me}
      SEED_ON_START: "true"
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  db-data:
